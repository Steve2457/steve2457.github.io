<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script>
      (function () {
        var s = "system";
        try { s = localStorage.getItem("theme") || "system"; } catch (e) {}
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = (s === "dark" || s === "light") ? s : "light dark";
        var dark = s === "dark" || (s === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme-setting", s);
      })();
    </script>
