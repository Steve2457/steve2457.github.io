<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script>
      (function () {
        var s = "system";
        try { s = localStorage.getItem("theme") || "system"; } catch (e) {}
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = (s === "dark" || s === "light") ? s : "light dark";
        var dark = s === "dark" || (s === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme-setting", s);
      })();
    </script>
    <title>Junan Hu</title>
    <meta name="author" content="Junan Hu">
    <meta name="description" content="Personal academic homepage of Junan Hu — Research Intern at Microsoft Research Asia (MSRA), undergraduate at Shandong University.">

    <meta name="google-site-verification" content="90LLdnv_VohIL8LAPHmYdfEwoK-EnUR99S39YLqb2zI">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥐</text></svg>">
    <link rel="canonical" href="https://steve2457.github.io/">
